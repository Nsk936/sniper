name: marketplace-sniper

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 min (GitHub peut retarder)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sniper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lancer le bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python sniper.py

      - name: Sauvegarder les annonces déjà vues
        run: |
          git config user.name "sniper-bot"
          git config user.email "sniper-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "maj annonces vues" && git push)
